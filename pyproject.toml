[project]
name = "convoprobe"
version = "0.0.1"
description = "Stress-test conversational agents with simulated users, scored checks, and CI regression gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "agents", "evaluation", "testing", "langgraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
authors = [
    { name = "haider268", email = "haider268@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
convoprobe = "convoprobe.cli:main"

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]
groq = [
    "langchain-groq>=1.1.3",
]
gemini = [
    "langchain-google-genai>=4.4.0",
]
langgraph = [
    "langgraph>=1.2.12",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph>=1.2.12",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["convoprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs a running local model or an API key; run with -m live"]
addopts = "-m 'not live' --cov=convoprobe --cov-report=term-missing"
